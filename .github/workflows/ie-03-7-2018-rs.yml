name: IE-03.7 2018 RS proof

on:
  push:
    paths:
      - "scripts/electoral/tse-acquire-2018-rs.mjs"
      - "scripts/electoral/tse-validate-proof-2018-rs.mjs"
      - ".github/workflows/ie-03-7-2018-rs.yml"

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Adquirir fontes oficiais TSE 2018 RS
        run: node scripts/electoral/tse-acquire-2018-rs.mjs
      - name: Validar prova 2018 RS
        run: node scripts/electoral/tse-validate-proof-2018-rs.mjs
      - name: Publicar relatório
        uses: actions/upload-artifact@v4
        with:
          name: ie-03-7-2018-rs-proof
          path: artifacts/electoral/tse-proof-validation-2018-rs.json
